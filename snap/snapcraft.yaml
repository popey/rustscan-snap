name: rustscan
base: core22
version: '2.4.1'
summary: RustScan
description: |
  The Modern Port Scanner.
  Fast, smart, effective.

grade: stable
confinement: strict

parts:
  rustscan:
    plugin: rust
    source: https://github.com/RustScan/RustScan.git
    source-tag: 2.4.1
    build-packages:
      - build-essential
      - pkg-config
    stage-packages:
      - nmap

apps:
  rustscan:
    command: bin/rustscan
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/blas
    plugs:
      - network
